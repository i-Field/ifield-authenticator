<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iField Auth — Secure 2FA Authenticator</title>
<style>
  :root {
    --bg: #0b0e17;
    --panel: #161b2e;
    --card: #1f2642;
    --accent: #6c8cff;
    --accent2: #8b5cf6;
    --text: #e8eaf6;
    --muted: #9aa3c7;
    --border: #2f3760;
    --danger: #f87171;
    --ok: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1000px 500px at 50% -10%, #2a2f5e 0%, transparent 60%), var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wrap { max-width: 500px; width: 100%; margin: 0 auto; }
  
  /* Шапка приложения */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .brand-flex { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(108,140,255,.3); color: #fff;
  }
  .logo-text { font-size: 1.4rem; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  
  .icon-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 1.1rem; transition: 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); }

  /* Строка поиска */
  .search-box { margin-bottom: 16px; }
  .search-box input {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: #fff; padding: 12px 16px; border-radius: 12px; outline: none; font-size: 0.95rem;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }

  /* Карточка добавления аккаунта */
  .add-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .input-group { margin-bottom: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1.2fr 1.2fr 1fr; gap: 8px; margin-bottom: 12px; }
  label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; background: #0f1324; border: 1px solid var(--border);
    color: #fff; padding: 9px 10px; border-radius: 8px; outline: none; font-size: 0.9rem;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  
  .btn-primary {
    width: 100%; padding: 11px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .btn-primary:hover { filter: brightness(1.1); }

  /* Список 2FA кодов */
  .auth-list { display: flex; flex-direction: column; gap: 12px; }
  .auth-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; position: relative; overflow: hidden;
    cursor: pointer; transition: transform 0.2s, border-color 0.2s;
  }
  .auth-item:hover { border-color: var(--accent); }
  .auth-item:active { transform: scale(0.98); }
  .auth-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .auth-name { font-weight: 600; font-size: 1rem; color: var(--text); }
  .auth-badge {
    font-size: 0.7rem; background: rgba(108,140,255,0.15); border: 1px solid var(--border);
    padding: 2px 6px; border-radius: 6px; color: var(--muted);
  }
  .auth-code {
    font-family: 'Consolas', monospace; font-size: 1.8rem; font-weight: 700;
    letter-spacing: 3px; color: var(--accent); margin-bottom: 6px;
  }
  .auth-code.hidden { filter: blur(6px); user-select: none; }
  .progress-bar {
    position: absolute; bottom: 0; left: 0; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1s linear;
  }
  .del-btn {
    background: transparent; border: none; color: var(--danger); font-size: 0.85rem; cursor: pointer; opacity: 0.6; padding: 4px;
  }
  .del-btn:hover { opacity: 1; }

  /* Модальное окно настроек */
  .modal {
    position: fixed; inset: 0; background: rgba(11, 14, 23, 0.8); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--border); width: 90%; max-width: 420px;
    border-radius: 20px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-header h3 { font-size: 1.2rem; font-weight: 700; }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.95rem;
  }
  .setting-row span { color: var(--muted); }
  
  /* Переключатель (Toggle Switch) */
  .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0; background-color: #0f1324;
    border: 1px solid var(--border); transition: .3s; border-radius: 26px;
  }
  .slider:before {
    position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background-color: var(--muted); transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background: var(--accent); border-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(22px); background-color: #fff; }

  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }

  /* Футер лаборатории */
  footer { text-align: center; margin-top: 30px; font-size: 0.85rem; color: var(--muted); }
  footer a { color: var(--accent2); text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }

  /* Уведомления (Toast) */
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(100px);
    background: #252c52; border: 1px solid var(--accent); color: #fff;
    padding: 10px 20px; border-radius: 999px; font-size: 0.85rem; opacity: 0; transition: 0.3s; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="wrap">
  <!-- Верхняя панель -->
  <header>
    <div class="brand-flex">
      <div class="logo-icon">2FA</div>
      <span class="logo-text">iField Auth</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
  </header>

  <!-- Поиск -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Поиск по сервисам...">
  </div>

  <!-- Карточка добавления -->
  <div class="add-card">
    <div class="input-group">
      <label>Название сервиса</label>
      <input type="text" id="serviceName" placeholder="GitHub / Google / VPN">
    </div>
    <div class="input-group">
      <label>Секретный ключ (Base32)</label>
      <input type="text" id="secretKey" placeholder="JBSWY3DPEHPK3PXP">
    </div>
    
    <div class="grid-3">
      <div>
        <label>Длина кода</label>
        <select id="digitsSelect">
          <option value="6" selected>6 цифр</option>
          <option value="8">8 цифр</option>
        </select>
      </div>
      <div>
        <label>Период (сек)</label>
        <input type="number" id="periodInput" value="30" min="5" max="300">
      </div>
      <div>
        <label style="opacity:0">Действие</label>
        <button class="btn-primary" id="addBtn">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Список аккаунтов -->
  <div class="auth-list" id="authList"></div>
</div>

<!-- Модальное окно настроек -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Настройки</h3>
      <button class="icon-btn" id="closeModal" style="width: 32px; height: 32px; font-size: 0.9rem;">✕</button>
    </div>
    
    <div class="setting-row">
      <span>Скрыть коды на экране</span>
      <label class="switch">
        <input type="checkbox" id="hideCodesToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Резервная копия (Экспорт)</span>
      <button class="btn-primary" id="exportBtn" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">Скачать JSON</button>
    </div>

    <div class="setting-row">
      <span>Восстановить (Импорт)</span>
      <button class="icon-btn" id="importTrigger" style="width: auto; padding: 6px 14px; font-size: 0.85rem; background: var(--card);">Загрузить</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>

    <div class="modal-btns">
      <button class="btn-primary" id="clearAllBtn" style="background: rgba(248,113,113,0.2); border: 1px solid var(--danger); color: var(--danger);">Удалить все данные</button>
    </div>
  </div>
</div>

<!-- Футер -->
<footer>
  <div class="footer-box">
    <span>iField_lab</span> by <a href="https://github.com/i-field" target="_blank">Kiiashko Roman</a>
  </div>
</footer>

<!-- Всплывающие уведомления -->
<div class="toast" id="toast"></div>

<!-- Подключение криптографической библиотеки TOTP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>

<script>
// Загрузка данных и настроек из localStorage
let accounts = JSON.parse(localStorage.getItem('ifield_auth_accounts') || '[]');
let settings = JSON.parse(localStorage.getItem('ifield_auth_settings') || '{"hideCodes": false}');

function saveAccounts() {
  localStorage.setItem('ifield_auth_accounts', JSON.stringify(accounts));
}

function saveSettings() {
  localStorage.setItem('ifield_auth_settings', JSON.stringify(settings));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Добавление нового аккаунта
function addAccount() {
  const name = document.getElementById('serviceName').value.trim();
  const secret = document.getElementById('secretKey').value.trim().replace(/\s+/g, '').toUpperCase();
  const digits = parseInt(document.getElementById('digitsSelect').value) || 6;
  const period = parseInt(document.getElementById('periodInput').value) || 30;

  if (!name || !secret) return alert('Заполните название и секретный ключ!');
  if (period < 5) return alert('Минимальный интервал — 5 секунд!');

  try {
    const totp = new OTPAuth.TOTP({ secret: secret, digits: digits, period: period });
    totp.generate();
  } catch(e) {
    return alert('Неверный формат секретного ключа (ожидается Base32)!');
  }

  accounts.push({ id: Date.now(), name, secret, digits, period });
  saveAccounts();
  
  document.getElementById('serviceName').value = '';
  document.getElementById('secretKey').value = '';
  
  render();
  showToast('Аккаунт успешно добавлен!');
}

// Удаление аккаунта
function deleteAccount(id, e) {
  e.stopPropagation();
  if (confirm('Удалить этот аккаунт?')) {
    accounts = accounts.filter(a => a.id !== id);
    saveAccounts();
    render();
  }
}

// Копирование кода в буфер обмена
function copyCode(code) {
  navigator.clipboard.writeText(code);
  showToast('Код скопирован!');
}

// Форматирование отображения (пробел посередине)
function formatCode(code, digits) {
  if (digits === 8) return code.slice(0, 4) + ' ' + code.slice(4);
  return code.slice(0, 3) + ' ' + code.slice(3);
}

// Рендеринг интерфейса
function render() {
  const container = document.getElementById('authList');
  const searchFilter = document.getElementById('searchInput').value.toLowerCase();
  container.innerHTML = '';

  const now = Math.floor(Date.now() / 1000);
  const filtered = accounts.filter(acc => acc.name.toLowerCase().includes(searchFilter));

  filtered.forEach(acc => {
    const digits = acc.digits || 6;
    const period = acc.period || 30;
    
    let code = '0'.repeat(digits);
    try {
      const totp = new OTPAuth.TOTP({ secret: acc.secret, digits: digits, period: period });
      code = totp.generate();
    } catch(e) {}

    const timeLeft = period - (now % period);
    const progressPercent = (timeLeft / period) * 100;
    const formattedCode = formatCode(code, digits);

    const item = document.createElement('div');
    item.className = 'auth-item';
    item.onclick = () => copyCode(code);
    item.innerHTML = `
      <div class="auth-header">
        <div>
          <span class="auth-name">${escapeHtml(acc.name)}</span>
          <span class="auth-badge">${digits}D / ${period}s</span>
        </div>
        <button class="del-btn" onclick="deleteAccount(${acc.id}, event)">🗑</button>
      </div>
      <div class="auth-code ${settings.hideCodes ? 'hidden' : ''}">${formattedCode}</div>
      <div class="progress-bar" style="width: ${progressPercent}%"></div>
    `;
    container.appendChild(item);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
}

// Управление модальным окном настроек
const modal = document.getElementById('settingsModal');
document.getElementById('settingsBtn').onclick = () => modal.classList.add('open');
document.getElementById('closeModal').onclick = () => modal.classList.remove('open');

const hideToggle = document.getElementById('hideCodesToggle');
hideToggle.checked = settings.hideCodes;
hideToggle.onchange = (e) => {
  settings.hideCodes = e.target.checked;
  saveSettings();
  render();
};

// Полная очистка базы
document.getElementById('clearAllBtn').onclick = () => {
  if (confirm('ВНИМАНИЕ! Вы удалите все свои 2FA ключи. Продолжить?')) {
    accounts = [];
    saveAccounts();
    render();
    modal.classList.remove('open');
    showToast('Все данные удалены');
  }
};

// Экспорт бэкапа в JSON
document.getElementById('exportBtn').onclick = () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(accounts));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", `iField_auth_backup_${Date.now()}.json`);
  dlAnchorElem.click();
};

// Импорт бэкапа
document.getElementById('importTrigger').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    try {
      const imported = JSON.parse(event.target.result);
      if (Array.isArray(imported)) {
        accounts = imported;
        saveAccounts();
        render();
        showToast('Бэкап успешно восстановлен!');
        modal.classList.remove('open');
      } else {
        alert('Неверный формат файла!');
      }
    } catch(err) {
      alert('Ошибка чтения JSON файла!');
    }
  };
  reader.readAsText(file);
};

// Слушатели событий
document.getElementById('addBtn').addEventListener('click', addAccount);
document.getElementById('searchInput').addEventListener('input', render);

// Автообновление интерфейса каждую секунду для таймера и смены кодов
setInterval(render, 1000);
render();
</script>
</body>
</html>
